name: Main bookin cafe workflow

on:
  pull_request:
    branches: [develop, main]
    types: [closed]
  push:
    branches: [feature/deploy]


jobs:

  check_conditions:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.pull_request.merged == true)
    runs-on: ubuntu-latest
    steps:
      - run: echo "📋✅  Условия выполнены, запускаем процесс деплоя"

  style_check:
    name: Use local style_check_action
    uses: ./.github/workflows/style_check.yml

  pytest_check:
    name: Use local style_check_action
    uses: ./.github/workflows/pytest_check.yml

  build_backend_celery_and_push_to_docker_hub:
    name: Build & Push Docker image backend, celery to DockerHub
    needs:
      - check_conditions
      - style_check
      - pytest_check
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [backend, celery]
        include:
          - target: backend
            image_name: bookin-cafe-backend
          - target: celery
            image_name: bookin-cafe-celery
    steps:
      - name: Check out the repo
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Push to DockerHub (${{ matrix.target }})
        uses: docker/build-push-action@v4
        with:
          context: .
          file: infra/Dockerfile
          target: ${{ matrix.target }}
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/${{ matrix.image_name }}:latest
            ${{ secrets.DOCKER_USERNAME }}/${{ matrix.image_name }}:${{ github.sha }}

  build_gateway_and_push_to_docker_hub:
    name: Build & Push Docker image gateway to DockerHub
    needs:
      - check_conditions
      - style_check
      - pytest_check
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Login to Docker
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Push to DockerHub
        uses: docker/build-push-action@v4
        with:
          context: ./infra/nginx/
          file: infra/nginx/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/bookin-cafe-gateway:latest
            ${{ secrets.DOCKER_USERNAME }}/bookin-cafe-gateway:${{ github.sha }}

  deploy-dev:
    name: Deploy DEV Cafe Booking
    if: github.ref_name != 'main'
    needs:
      - check_conditions
      - style_check
      - pytest_check
      - build_backend_celery_and_push_to_docker_hub
      - build_gateway_and_push_to_docker_hub
    environment: development
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v3

      - name: Deploy to server
        uses: ./.github/actions/deploy
        with:
          host: ${{ secrets.SERVER_HOST }}
          user: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          env_content: |
            # App env (vars)
            LOG_TO_FILE=${{ vars.LOG_TO_FILE }}
            LOG_LEVEL=${{ vars.LOG_LEVEL }}
            ALLOW_ORIGINS=${{ vars.ALLOW_ORIGINS }}
            # App env (secrets)
            SECRET=${{ secrets.SECRET }}
            SUPERUSER_EMAIL=${{ secrets.SUPERUSER_EMAIL }}
            SUPERUSER_PASSWORD=${{ secrets.SUPERUSER_PASSWORD }}
            SUPERUSER_NAME=${{ secrets.SUPERUSER_NAME}}

            # Docker Hub (secrets)
            DOCKER_USERNAME=${{ secrets.DOCKER_USERNAME }}

            # Postgresql (secrets)
            POSTGRES_USER=${{ secrets.POSTGRES_USER }}
            POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}

            # RabbitMQ (secrets)
            RABBITMQ_DEFAULT_USER=${{ secrets.RABBITMQ_DEFAULT_USER }}
            RABBITMQ_DEFAULT_PASS=${{ secrets.RABBITMQ_DEFAULT_PASS }}

            # Flower (secrets)
            FLOWER_BASIC_AUTH=${{ secrets.FLOWER_BASIC_AUTH }}

            # SMTP (secrets)
            SMTP_USER=${{ secrets.SMTP_USER }}
            SMTP_FROM_EMAIL=${{ secrets.SMTP_FROM_EMAIL }}
            SMTP_PASSWORD=${{ secrets.SMTP_PASSWORD }}

  deploy-prod:
    name: Deploy PROD Cafe Booking
    if: github.ref_name == 'main'
    needs:
      - check_conditions
      - style_check
      - pytest_check
      - build_backend_celery_and_push_to_docker_hub
      - build_gateway_and_push_to_docker_hub
    environment: production
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v3

      - name: Deploy to server
        uses: ./.github/actions/deploy
        with:
          host: ${{ secrets.SERVER_HOST }}
          user: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          env_content: |
            # App env (vars)
            LOG_TO_FILE=${{ vars.LOG_TO_FILE }}
            LOG_LEVEL=${{ vars.LOG_LEVEL }}
            ALLOW_ORIGINS=${{ vars.ALLOW_ORIGINS }}
            # App env (secrets)
            SECRET=${{ secrets.SECRET }}
            SUPERUSER_EMAIL=${{ secrets.SUPERUSER_EMAIL }}
            SUPERUSER_PASSWORD=${{ secrets.SUPERUSER_PASSWORD }}
            SUPERUSER_NAME=${{ secrets.SUPERUSER_NAME}}

            # Docker Hub (secrets)
            DOCKER_USERNAME=${{ secrets.DOCKER_USERNAME }}

            # Postgresql (secrets)
            POSTGRES_USER=${{ secrets.POSTGRES_USER }}
            POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}

            # RabbitMQ (secrets)
            RABBITMQ_DEFAULT_USER=${{ secrets.RABBITMQ_DEFAULT_USER }}
            RABBITMQ_DEFAULT_PASS=${{ secrets.RABBITMQ_DEFAULT_PASS }}

            # Flower (secrets)
            FLOWER_BASIC_AUTH=${{ secrets.FLOWER_BASIC_AUTH }}

            # SMTP (secrets)
            SMTP_USER=${{ secrets.SMTP_USER }}
            SMTP_FROM_EMAIL=${{ secrets.SMTP_FROM_EMAIL }}
            SMTP_PASSWORD=${{ secrets.SMTP_PASSWORD }}
