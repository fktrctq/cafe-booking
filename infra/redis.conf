###############################################################################
# ОПТИМАЛЬНЫЙ redis.conf ДЛЯ КОНТЕЙНЕРА (FastAPI + Redis как КЭШ)
# Основан на официальном файле: https://github.com/redis/docs/blob/main/content/operate/oss_and_stack/management/config.md
###############################################################################

# =========================== 1. СЕТЬ (NETWORK) ===========================
# Внутри контейнера слушаем все интерфейсы
bind 0.0.0.0
# TCP-порт для подключений
port 6379
# Отключаем защиту (только внутри Docker сети!)
protected-mode no
# Не закрывать соединения по таймауту
timeout 0
# Проверка живых соединений
tcp-keepalive 60
# Размер очереди ожидающих соединений
tcp-backlog 511

# =========================== 2. ОБЩИЕ (GENERAL) ===========================
# НЕ демон (контейнер сам управляет)
daemonize no
# PID-файл не нужен в контейнере
pidfile ""
# Уровень: debug, verbose, notice, warning, nothing
loglevel verbose
# Логи в файл (монтируйте volume) /var/log/redis/redis.log
logfile ""
# Только 1 база для кэша (экономия памяти)
databases 1
# Не показывать лого при старте
always-show-logo no
# Изменять заголовок процесса
set-proc-title yes

# =========================== 3. ПЕРСИСТЕНТНОСТЬ (ВЫКЛЮЧЕНА) ===========================
# Полностью отключаем RDB снапшоты
save ""
# Полностью отключаем AOF
appendonly no

# =========================== 4. ПАМЯТЬ (MEMORY MANAGEMENT) ===========================
# Лимит памяти (настройте под контейнер)
maxmemory 1gb
# Вытеснение по LRU (идеально для кэша)
maxmemory-policy allkeys-lru
# Точность LRU (выше = точнее, но больше CPU)
maxmemory-samples 10
# Агрессивность вытеснения (по умолчанию)
maxmemory-eviction-tenacity 10
# Усилие на удаление истёкших ключей (1-10)
active-expire-effort 1

# =========================== 5. ЛЕНИВОЕ УДАЛЕНИЕ (LAZY FREEING) ===========================
# Асинхронное удаление при вытеснении
lazyfree-lazy-eviction yes
# Асинхронное удаление истёкших ключей
lazyfree-lazy-expire yes
# Асинхронное удаление при замене ключей
lazyfree-lazy-server-del yes
# DEL работает как UNLINK (асинхронно)
lazyfree-lazy-user-del yes
# FLUSHALL/FLUSHDB асинхронны по умолчанию
lazyfree-lazy-user-flush yes

# =========================== 6. ПРОИЗВОДИТЕЛЬНОСТЬ ===========================
# Потоков для сетевого I/O (на 4 ядра)
io-threads 2
# Только запись в потоках
io-threads-do-reads no
# Отключаем Transparent Huge Pages
disable-thp yes
# Активная перестройка хэш-таблиц
activerehashing yes
# Частота фоновых задач
hz 10
# Адаптивная частота при нагрузке
dynamic-hz yes

# =========================== 7. БЕЗОПАСНОСТЬ ===========================

# Пароль не требуется (изолированный контейнер)
# requirepass your_password

# Отключаем опасные команды (защита от случайностей)
# rename-command FLUSHDB ""
# rename-command FLUSHALL ""
# rename-command CONFIG ""
# rename-command DEBUG ""

# =========================== 8. КЛИЕНТЫ И БУФЕРЫ ===========================
# Максимум одновременных клиентов
maxclients 10000
client-output-buffer-limit normal 0 0 0

# =========================== 9. МОНИТОРИНГ ===========================
# Логировать команды медленнее 10ms
slowlog-log-slower-than 10000
# Хранить 128 записей
slowlog-max-len 128
# Классический мониторинг выключен
latency-monitor-threshold 0
# Включен по умолчанию (расширенный мониторинг)
# latency-tracking yes
# Уведомления выключены
notify-keyspace-events ""

# =========================== 10. АКТИВНАЯ ДЕФРАГМЕНТАЦИЯ ===========================
# Включена (важно для кэша)
activedefrag yes
active-defrag-ignore-bytes 100mb
active-defrag-threshold-lower 10
active-defrag-threshold-upper 100
active-defrag-cycle-min 1
active-defrag-cycle-max 25
active-defrag-max-scan-fields 1000
# Фоновый поток Jemalloc
jemalloc-bg-thread yes

# =========================== 11. ОСТАЛЬНЫЕ НАСТРОЙКИ (ПО УМОЛЧАНИЮ) ===========================
hash-max-listpack-entries 512
hash-max-listpack-value 64
list-max-listpack-size -2
list-compress-depth 0
set-max-intset-entries 512
set-max-listpack-entries 128
set-max-listpack-value 64
zset-max-listpack-entries 128
zset-max-listpack-value 64
hll-sparse-max-bytes 3000
stream-node-max-bytes 4096
stream-node-max-entries 100

# Прочее
locale-collate ""
