name: pytest_check

on:
  workflow_call:
  workflow_dispatch:

jobs:
  check_pytest:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: cafe_test
        ports:
          - 5432:5432
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5

    steps:
      - name: Check out code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: 3.12

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: '0.4'
          enable-cache: true

      - name: Install dependies
        run: uv sync --frozen

      - name: Create .env file
        shell: bash
        run: |
          cat << EOF > .env
          # App env (vars)
          DB_PYTEST=cafe_test
          POSTGRES_HOST=127.0.0.1
          POSTGRES_PORT=5432
          POSTGRES_USER=postgres
          POSTGRES_PASSWORD=postgres
          EOF

      - name: Run pytest
        run: uv run pytest
