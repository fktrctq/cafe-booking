server {
    server_name cafe-booking-dev.ruviewer.ru;
    server_tokens off;
    client_max_body_size 20m;
    proxy_read_timeout 300;
    proxy_connect_timeout 300;
    proxy_send_timeout 300;
    root /var/www/cafe-booking;
    index index.html;

   location /api/v1/ {
        include /etc/nginx/proxy-headers.conf;
        proxy_pass http://127.0.0.1:8080/api/v1/;
    }

    location /docs {
        include /etc/nginx/proxy-headers.conf;
        proxy_pass http://127.0.0.1:8080/docs;
    }

    location /redoc {
        include /etc/nginx/proxy-headers.conf;
        proxy_pass http://127.0.0.1:8080/redoc;
    }

    location /openapi.json {
        include /etc/nginx/proxy-headers.conf;
        proxy_pass http://127.0.0.1:8080/openapi.json;
    }

    location /health {
        include /etc/nginx/proxy-headers.conf;
        proxy_pass http://127.0.0.1:8080/health;
    }

    location /flower/ {
        include /etc/nginx/proxy-headers.conf;
        proxy_pass http://127.0.0.1:8080/flower/;
        proxy_redirect http://$host:8080/ https://$host/;
    }

    location /rabbitmq/ {
        include /etc/nginx/proxy-headers.conf;
        proxy_pass http://127.0.0.1:8080/rabbitmq/;
        proxy_redirect http://$host:8080/ https://$host/;
    }

 listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/cafe-booking-dev.ruviewer.ru/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/cafe-booking-dev.ruviewer.ru/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}
server {
    if ($host = cafe-booking-dev.ruviewer.ru) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    server_name cafe-booking-dev.ruviewer.ru;
    return 404; # managed by Certbot


}
