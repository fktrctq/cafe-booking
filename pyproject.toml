[project]
name = "workspace"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.18.4",
    "asyncpg>=0.31.0",
    "bcrypt==4.0.1",
    "fastapi>=0.136.1",
    "Pillow>=11.0.0",
    "pydantic[email]>=2.13.3",
    "pydantic-settings>=2.14.0",
    "python-jose",
    "passlib[bcrypt]",
    "sqlalchemy[asyncio]>=2.0.49",
    "uvicorn>=0.46.0",
    "celery==5.6.3",
    "python-multipart>=0.0.29",
    "gevent>=26.5.0",
    "psycopg2-binary>=2.9.12",
    "jinja2>=3.1.6",
    "sqlalchemy-celery-beat>=0.8.4",
    "redis>=8.0.0",
    "msgpack>=1.2.1",
    "orjson>=3.11.9",
]

[dependency-groups]
dev = [
    "pre-commit>=4.6.0",
    "ruff>=0.15.12",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
pythonpath = ["src"]
